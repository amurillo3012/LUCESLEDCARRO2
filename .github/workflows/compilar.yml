name: Generar IPA Real Luces LED
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Estructurar Proyecto e Inyectar Plantilla
        run: |
          # Crear carpetas estándar de una App de iPhone
          mkdir -p LEDCarApp/Sources
          
          # Copiar tus archivos originales en el lugar correcto
          [ -f LEDCarApp.swift ] && cp LEDCarApp.swift LEDCarApp/Sources/
          [ -f LEDEffectsCatalog.swift ] && cp LEDEffectsCatalog.swift LEDCarApp/Sources/
          [ -f EnhancedSpotifyIntegration.swift ] && cp EnhancedSpotifyIntegration.swift LEDCarApp/Sources/
          [ -f Info.plist ] && cp Info.plist LEDCarApp/

          # Crear un archivo de configuración mínimo para enlazar SwiftUI
          cat << 'EOF' > LEDCarApp/Sources/main.swift
          import SwiftUI
          // Archivo de inicio del compilador
          EOF

          # Generar el esqueleto del proyecto usando el constructor nativo de Apple
          xcrun -sdk iphoneos swiftc -emit-library -target arm64-apple-ios14.0 LEDCarApp/Sources/*.swift -o LEDCarApp/LEDCarApp.dylib || true

      - name: Crear Estructura de Aplicacion Directa (.app)
        run: |
          # Creamos el contenedor real que va dentro del iPhone
          mkdir -p build/Payload/LEDCarApp.app
          
          # Mover los archivos de permisos y el binario simulado
          cp LEDCarApp/Info.plist build/Payload/LEDCarApp.app/
          
          # Forzar al compilador a empaquetar el código de interfaz SwiftUI y Bluetooth
          xcrun -sdk iphoneos swiftc LEDCarApp/Sources/LEDCarApp.swift LEDCarApp/Sources/LEDEffectsCatalog.swift LEDCarApp/Sources/EnhancedSpotifyIntegration.swift -target arm64-apple-ios14.0 -o build/Payload/LEDCarApp.app/LEDCarApp
          
          # Comprimir en formato .ipa real
          cd build && zip -r LEDCarApp.ipa Payload

      - name: Subir Archivo IPA Final
        uses: actions/upload-artifact@v4
        with:
          name: LEDCarApp-Instalable
          path: build/LEDCarApp.ipa
