workflows:
  ios-app:
    name: LED Car App Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Estructurar Archivos para Xcode
        script: |
          mkdir -p LEDCarApp
          [ -f LEDCarApp.swift ] && mv LEDCarApp.swift LEDCarApp/
          [ -f LEDEffectsCatalog.swift ] && mv LEDEffectsCatalog.swift LEDCarApp/
          [ -f EnhancedSpotifyIntegration.swift ] && mv EnhancedSpotifyIntegration.swift LEDCarApp/
          [ -f Info.plist ] && mv Info.plist LEDCarApp/
          
          # Generar proyecto Xcode falso en el servidor para saltar restricciones
          pip install mod_pbxproj
      - name: Compilar App sin Restricciones de Apple
        script: |
          # Compilación limpia omitiendo la firma digital en la nube
          xcodebuild archive -project "LEDCarApp.xcodeproj" -scheme "LEDCarApp" -archivePath "build/ios/LEDCarApp.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          
          # Forzar la creación del archivo .app instalable
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/LEDCarApp.xcarchive/Products/Applications/*.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r LEDCarApp.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
